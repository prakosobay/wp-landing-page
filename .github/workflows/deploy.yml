name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Build ulang setiap hari pukul 00:05 WIB, supaya harga, meta SEO, dan
  # halaman pre-render otomatis kembali normal begitu promo berakhir.
  schedule:
    - cron: '5 17 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Nama repositori diambil otomatis, tidak perlu diganti manual.
          # Untuk repositori "<username>.github.io", ubah menjadi: /
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # URL publik untuk canonical, Open Graph, sitemap, dan JSON-LD.
          # Jika memakai domain sendiri, ganti mis. menjadi: https://temanwedding.co/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
